[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colonymind-hermes"
version = "1.1.0"
description = "ColonyMind's adapter and memory provider for stock Hermes. A mind for Hermes agents: persistent memory, commitments, initiative and measured autonomy"
readme = "docs/HERMES-ADAPTER.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["httpx>=0.27,<0.29", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "setuptools>=77", "wheel"]
quality = ["ruff>=0.13,<1", "twine>=6,<8"]
native-memory = ["nemo-relay>=0.8.3,<0.9"]

[project.urls]
Homepage = "https://aevonix.com/colonymind"
Repository = "https://github.com/Aevonix/ColonyMind"

[project.entry-points."hermes_agent.plugins"]
colonymind = "colonymind_hermes"
colonymind-gates = "colonymind_gates"

[project.entry-points."hermes_agent.memory_providers"]
colonymind-memory = "colonymind_memory"

[tool.setuptools]
packages = ["colonymind_hermes", "colonymind_hermes.archive_core", "colonymind_memory", "colonymind_gates", "colonymind_hand_context", "colonymind_shared"]
include-package-data = false

[tool.setuptools.package-dir]
colonymind_hermes = "plugins/hermes-plugin"
"colonymind_hermes.archive_core" = "sidecar/colonymind/session_archive"
colonymind_memory = "plugins/colonymind-memory"
colonymind_gates = "plugins/instinct-gates"
colonymind_hand_context = "sidecar/colonymind_hand_context"
colonymind_shared = "sidecar/colonymind_shared"

[tool.setuptools.package-data]
colonymind_hermes = ["plugin.yaml"]
colonymind_memory = ["plugin.yaml", "SKILL.md"]
colonymind_gates = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests/hermes_adapter"]
faulthandler_timeout = 240
timeout = 300
timeout_method = "thread"
markers = [
    "hardware_latency: latency enforced locally and reported on GitHub Actions",
    "requires_sidecar: needs the colonymind sidecar package in the test interpreter",
    "requires_live_qualification: needs an external live qualification prerequisite",
]

[tool.colonymind]
requires-hermes = ">=0.21.3,<0.24"

# Start with runtime errors, not a repository-wide formatting/style migration.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
