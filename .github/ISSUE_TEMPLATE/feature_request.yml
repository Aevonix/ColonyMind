name: Feature request
description: Something ColonyMind should do, or do differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ColonyMind runs beside stock Hermes through its plugin and memory-provider interfaces and never patches it.
        A change that needs Hermes itself belongs in the Hermes project.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the outcome you want, in your own words.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you picture it working. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
