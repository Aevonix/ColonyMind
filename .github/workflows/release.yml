name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/ci.yml

  # --- Canonical adapter and sidecar → PyPI ---
  pypi-colonymind:
    if: github.repository == 'Aevonix/ColonyMind'
    needs: [qualification, pypi-colonymind-hermes]
    runs-on: ubuntu-latest
    environment: pypi-colonymind
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Select sidecar distributions
        run: |
          mkdir sidecar-dist
          mv dist/colonymind-*.whl dist/colonymind-*.tar.gz sidecar-dist/
      - name: Publish sidecar to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sidecar-dist/
          # Re-running a release (e.g. to recover a failed later job) must not
          # fail just because this version is already on PyPI.
          skip-existing: true
          # An API token held as a secret of this job's environment is used when set; without it the action authenticates by trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}

  pypi-colonymind-hermes:
    if: github.repository == 'Aevonix/ColonyMind'
    needs: qualification
    runs-on: ubuntu-latest
    environment: pypi-colonymind-hermes
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Select adapter distributions
        run: |
          mkdir adapter-dist
          mv dist/colonymind_hermes-*.whl dist/colonymind_hermes-*.tar.gz adapter-dist/
      - name: Publish adapter to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapter-dist/
          skip-existing: true
          # An API token held as a secret of this job's environment is used when set; without it the action authenticates by trusted publishing.
          password: ${{ secrets.PYPI_API_TOKEN }}

  # --- Container quickstart image (stock Hermes plus ColonyMind, docker/) → GHCR ---
  docker:
    if: github.repository == 'Aevonix/ColonyMind'
    needs: qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-container
          path: qualified-image/
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image built and checked by qualification
        run: |
          docker load --input qualified-image/colonymind-image.tar
          # The image qualification recorded, not a rebuild or another tag's.
          [ "$(docker image inspect "colonymind-qualified:${GITHUB_SHA}" --format '{{.Id}}')" = "$(cat qualified-image/colonymind-image-id.txt)" ]
          docker tag "colonymind-qualified:${GITHUB_SHA}" "ghcr.io/aevonix/colonymind:${GITHUB_REF_NAME}"
          docker tag "colonymind-qualified:${GITHUB_SHA}" ghcr.io/aevonix/colonymind:latest
          docker push "ghcr.io/aevonix/colonymind:${GITHUB_REF_NAME}"
          docker push ghcr.io/aevonix/colonymind:latest

  # --- The public API subset (docs/API.md) → openapi.json on the Release ---
  # Exported from the sidecar wheel qualification built, so the spec describes the code that ships and names
  # its version (an adapter-only tag keeps the sidecar version it ships).
  api-spec:
    needs: qualification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Export the public API spec from the qualified sidecar
        run: |
          python -m pip install -c requirements/release-py312.txt dist/colonymind-*.whl
          python -m colonymind.api.public_spec openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-api-spec
          path: openapi.json
          if-no-files-found: error

  # --- GitHub Release ← tag + CHANGELOG ---
  # Runs only after PyPI and GHCR publish and the API spec exported, so the
  # Release never points at artifacts that failed to ship.
  github-release:
    if: github.repository == 'Aevonix/ColonyMind'
    needs: [pypi-colonymind, pypi-colonymind-hermes, docker, api-spec]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: public-api-spec
          path: api-spec/
      - name: Create GitHub Release from tag + CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # Extract this version's section from CHANGELOG.md.
          # Headings are "## <tag> - <title>" (.github/RELEASE_NOTES_TEMPLATE.md); capture until the next "## ".
          awk -v tag="$tag" '
            /^## / { if ($2 == tag) { f=1; next } else if (f) { f=0 } }
            f { print }
          ' CHANGELOG.md > notes.md
          sed -i -e '/./,$!d' notes.md            # drop leading blank lines
          [ -s notes.md ] || echo "Release $tag" > notes.md
          title="$(grep -m1 "^## ${tag} " CHANGELOG.md | sed 's/^## //')"
          [ -n "$title" ] || title="$tag"
          # Idempotent: edit an existing Release on re-run, otherwise create it.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file notes.md
          else
            gh release create "$tag" --title "$title" --notes-file notes.md --verify-tag
          fi
      # The public API subset's spec (docs/API.md); a re-run replaces it.
      - name: Attach the public API spec
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" api-spec/openapi.json --clobber
